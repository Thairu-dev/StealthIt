name: CD Pipeline (Release)

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags like v1.0.0

jobs:
  build-and-release:
    name: Build & Release Executables
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Antigravity Original
        run: |
          cd antigravity-original
          pip install -r requirements.txt
          pyinstaller StealthIt.spec
          # Zip the resulting executable
          Compress-Archive -Path dist\StealthIt.exe -DestinationPath ..\StealthIt-Original.zip

      - name: Build Claude Opus 5
        run: |
          cd claude-opus-5
          pip install -r requirements.txt
          # Using pyinstaller directly for the module
          pyinstaller --noconfirm --onedir --windowed --name "StealthIt-Claude" stealthit/__main__.py
          # Zip the resulting dist directory
          Compress-Archive -Path dist\StealthIt-Claude -DestinationPath ..\StealthIt-Claude.zip

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StealthIt-Original.zip
            StealthIt-Claude.zip
          draft: false
          prerelease: false
          generate_release_notes: true
