name: CD Pipeline (Release)

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v3.0.0-beta.1

jobs:
  build-and-release:
    name: Build & Release Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: stealthit-electron/package-lock.json

      - name: Install dependencies
        working-directory: stealthit-electron
        run: npm ci

      - name: Run Unit Tests
        working-directory: stealthit-electron
        run: npm test

      - name: Package Windows Installer & Portable Exe
        working-directory: stealthit-electron
        run: npm run dist:win

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stealthit-electron/dist/*.exe
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
