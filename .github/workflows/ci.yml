name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Typecheck, Build & Test (stealthit-electron)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: stealthit-electron/package-lock.json

      - name: Install dependencies
        working-directory: stealthit-electron
        run: npm ci

      - name: Typecheck & Build
        working-directory: stealthit-electron
        run: npm run build

      - name: Run Unit Tests
        working-directory: stealthit-electron
        run: npm test
